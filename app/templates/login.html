{% extends "base.html" %}
{% block title %}Login — ShadowScan{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 80px auto;">
  <div style="text-align: center; margin-bottom: 32px;">
    <h1 style="font-size: 28px; color: var(--accent);">⬡ ShadowScan</h1>
    <p class="text-muted" style="margin-top: 8px;">Cybersecurity Learning Platform</p>
  </div>

  <div class="card">
    <h2 class="mb-20">Log In</h2>

    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit" class="btn btn-accent" style="width: 100%;">Log In</button>
    </form>

    <p style="text-align: center; margin-top: 16px;" class="text-sm text-muted">
      Don't have an account? <a href="/register" class="link">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
